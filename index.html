 dan de helft van de totale afstand van de rand van de green en ±15-30 meter van de hole is een prima uitgangspositie. Voor deze slag gebruiken we een sand- of lobwedge. Leg een tourstick op de grond tussen je voeten en de bal, parallel aan de bal-doellijn. Gebruik deze tourstick om de stand van het clubblad en je lichaamslijnen te controleren en zo nodig aan te passen. Vervolgens speel je de bal naar de hole waarbij je aandacht besteed aan het hele plaatje zoals je dat met jouw coach geschetst hebt te denken aan: de intentie wat je wilt met de bal, beginstand, beweging en eindstand. Hierbij kan gedacht worden aan:\n\nClubblad een fractie open\nSmalle stand ±2 clubhoofdbreedte tussen je voeten \nGewicht met mate naar het voorste been door je borstbeen wat naar deze zijde te laten leunen\nVoorste voet een ±30 graden naar het doel gedraaid (geflared)\nBalpositie onder borstbeen\nGrip voorkant bal\nSamenwerking van handen, armen en lichaam\nClub wijst naar gesp in eindstand\nGelijkmatig tempo\nZwaailengte symmetrisch houden", "v": "Vanuit deze standaarduitvoering zijn er vele variaties mogelijk, experimenteer bijvoorbeeld met de balpositie, afstand tot de bal, verschillende wedges, etc. en observeer het effect hiervan op de balvlucht en rol."}, {"n": "Trail arm", "c": "Hoge approach", "t": "techniek", "g": "In deze oefening gaan we trainen op radiuscontrole. De radius van de beweging kan uitgelegd worden als de afstand van het clubhoofd tot aan het borstbeen. De mate waarin een speler controle heeft over de radius zal samen met andere factoren invloed hebben op de diepte (vertical lowpoint) van de zwaai en zodoende veel invloed hebben op de grondinteractie en uiteindelijk op de kwaliteit van het contact met de bal.", "d": "Gebruik voor deze oefening een wedge. Neem je normale set up in en pak vervolgens de club halverwege de grip vast met je trail hand (rechts voor rechtshandige spelers). Je legt je lead hand (links voor rechtshandige spelers) op je trail bovenarm en drukt deze zachtjes tegen je torso. Vanuit hier speel je de bal waarbij het contact tussen je torso en arm behouden blijft. Start met deze oefening eerst vanuit een semi rough ligging of vanaf een korte tee en werk vanuit naar een fairway ligging toe.", "v": "Experimenteer met verschillende grashoogtes."}, {"n": "T-rex", "c": "Hoge approach", "t": "techniek", "g": "Je gaat leren om je lichaam en armen goed te laten samenwerken in de beweging en een constante radius te houden.", "d": "Kies een hoge approach situatie waarbij de speelplek op de fairway is op net iets minder dan de helft van de totale afstand van de rand van de green en ±15 meter van de hole. Ga rechtop staan met een smalle stand en de bal midden tussen je voeten gepositioneerd. Strek je armen en de club voor je uit dat club en armen een rechte lijn vormen door je polsen zijn nu vrijwel maximaal ontknikt. Trek je elle bogen vervolgens in zodat je bovenarmen contact maken met je bovenlichaam, buig nu voorover en adresseer de club achter de bal. Maak vanuit deze positie een symmetrische beweging met je lichaam als motor van de zwaai en waarbij het contact tussen bovenlichaam en bovenarmen gedurende de gehele zwaai behouden blijft.", "v": "Een andere manier om de connectie van armen en lichaam te trainen is door een handdoek of 2 headcovers onder je oksels en speel verschillende hoge approaches waarbij de handdoek onder je oksels blijft zitten."}, {"n": "Ladder", "c": "Lage approach", "t": "skill", "g": "In deze oefening gaan we trainen op het doseren van de afstand. Om de bal bij zo dicht mogelijk bij de hole te krijgen met een lage approach is het onder andere cruciaal om de afstand goed te doseren.", "d": "Maak op een redelijk vlak stuk green een rij met tees waarbij de verste tee op 20 meter van de speelplek en de dichtstbijzijnde op 8 meter van de speelplek staat en er telkens 2 meter afstand tussen de tees zit. Speel vanaf een fairway ligging de bal met als doel om de bal binnen een stoklengte te stoppen bij een vooraf bepaalde tee. Werk in eerste instantie in serie door bijvoorbeeld te starten bij de voorste tee en daarna eentje verder, etc. totdat je elke tee hebt gehaald. Wanneer je beter wordt kan je overgaan naar meer random training door lang, kort en middenafstanden met elkaar af te wisselen.", "v": "Je kunt deze oefening eenvoudig makkelijker of moeilijker maken door het einddoel (binnen 1 stoklengte) te verkleinen of vergroten, meer of minder afstanden uit te zetten, de afstanden tussen de tees te verkleinen, de speelafstand te verkleinen of vergroten of de speelsituatie te veranderen door bijvoorbeeld fairway en semi-rough af te wisselen of de tees in een uphill/downhill situatie uit te zetten, of de opdracht moeilijker te maken door bijvoorbeeld 2 ballen achter elkaar binnen een stoklengte te laten eindigen. Maak er een completion drill van door alle tees gehaald te hebben of 3 kansen per tee waarvan er 1 of meerdere in binnen 1 clublengte van de tee moeten eindigen. Of juist een scorekaart opdracht waarbij je random alle tees probeert de halen met 1 bal, waarbij gehaald doel 1 punt is."}, {"n": "Low point control", "c": "Hoge approach", "t": "skill", "g": "In deze oefening ga je trainen om het laagste punt van de zwaai, ook wel low point genoemd, zowel horizontaal als verticaal (zwaaidiepte) op een functionele plek ten opzichte van de bal te hebben. Met name de verticale component heeft enorm veel invloed op het grondcontact van de club en zodoende veel invloed op de kwaliteit van het contact met de bal. Het is dus van groot belang om hier controle over te hebben.", "d": "Kies een hoge approach situatie waarbij de speelplek op de fairway is op net iets minder dan de helft van de totale afstand van de rand van de green en ±15-30 meter van de hole. Gebruik een korte tee ±3 cm en tee de bal ±1cm boven grond op. Speel de bal waarbij je wel de tee raakt maar niet de grond. Wanneer dit regelmatig lukt (bijvoorbeeld 4 uit 5 keer) dan is het tijd om te gaan variëren door bijvoorbeeld afwisselend een bal vanaf de tee te spelen en daarna vanaf de grond. Of tee 5 ballen op met allemaal verschillende hoogtes en probeer de bal in alle situaties zuiver te raken.", "v": "Een variatie op dit thema is om een zuiver geraakte hoge approach uit de bunker te slaan, hier krijg je meteen feedback over de diepte van de zwaai en waar de club het zand raakt ten opzichte van de bal (zie low point control distance wedges)."}, {"n": "Flight control", "c": "Hoge approach", "t": "skill", "g": "De hoogte waarmee een schot gespeeld wordt zal onder andere veel invloed hebben op de hoeveelheid rol die de bal zal krijgen en zodoende uiteindelijk ook op de totale afstand. In deze oefening gaan we trainen om de vertrekhoek en daarmee de hoogte van de bal te beïnvloeden.", "d": "Kies een hoge approach situatie waarbij de speelplek op de fairway is op ongeveer een derde van de totale afstand van de rand van de green en ±15-30 meter van de hole. Het doel is om de bal binnen 2 meter van de hole te laten eindigen met achtereenvolgend een lagere, hogere en medium balvlucht. Het gaat hierbij om subtiele verschillen van bijvoorbeeld 1 meter hoog, 3 meter hoog en 2 meter hoog en niet de extremen aangezien dat meer speciale schoten zijn zoals het lobshot.\n\nEr zijn verscheidene factoren die de uiteindelijke hoogte van de bal bepalen en zodoende ook verscheidene manieren om de hoogte van de bal te beïnvloeden. Een van die factoren waar we in deze oefening de nadruk leggen is de hoeveelheid loft op impact, oftewel de dynamische loft. De dynamische loft kunnen we onder andere beïnvloeden door:\nClubkeuze\nBalpositie en shaftlean in set up (statisch)\nRelease (dynamisch)\nEen combinatie van bovenstaande\n\nOpdracht 1: speel achtereenvolgens de bal met je gap wedge (of pitching wedge), lob wedge en sand wedge om drie verschillende vluchthoogtes te krijgen en de bal binnen 2 meter van de hole te laten eindigen.\n\nOpdracht 2: speel achtereenvolgens de bal met een balpositie achter het midden en veel shaftlean, een balpositie voorbij het midden en met een verticale shaft en uiteindelijk in het midden en een klein beetje shaftlean om drie verschillende vluchthoogtes te krijgen en de bal binnen 2 meter van de hole te laten eindigen.\n\nOpdracht 3: speel vanuit een standaardbeginstand achtereenvolgens de bal met een eindstand waarbij de club nog naar beneden wijst waarbij er in het geval er water in de shaft zou zitten dit er niet uitloopt, naar boven wijst waarbij het water uit de grip zou lopen en uiteindelijk recht naar voren wijst om drie verschillende vluchthoogtes te krijgen en de bal binnen 2 meter van de hole te laten eindigen.", "v": "Experimenteer eens met combinaties van clubkeuze, statisch en dynamisch, of doe dezelfde opdrachten vanuit de rough."}, {"n": "Hit the spot", "c": "Hoge approach", "t": "skill", "g": "De afstand die de bal door de lucht vliegt, de carry, is een van de componenten die bijdraagt aan de totale afstand van de bal, het is dus van belang dat je hier controle over krijgt. In deze oefening ga je trainen om de carry naar wens te beïnvloeden.", "d": "Maak een landingsgebied op de green door 2 toursticks op 2 meter afstand van elkaar haaks op de speellijn te plaatsen. Leg 4x3 ballen op respectievelijk 6, 9, 12 en 15 meter van het landingsgebied, kan zowel op de fairway als rough. Begin bij de eerste afstand en speel respectievelijk 1 bal voorbij het landingsgebied, de volgende ervoor en de laatste in het landingsgebied. Is dit gelukt ga je door naar de volgende afstand. Start met de opdracht in serie te doen (van voor naar achter werken) en wanneer dit goed lukt dan ga je meer variabel te werk bijvoorbeeld 9, 15, 6, 12. Hoe beter je wordt hoe kleiner je de marges van voorbij, voor en de uiteindelijke landingszone kunt maken.\n\nOm uiteindelijk nog beter te worden is het aan te raden om scherp te zijn op de variatie in hoogte waarmee je de bal speelt, hoe constanter deze is hoe constanter de landingshoek en hoe voorspelbaarder de hoeveelheid rol zal zijn en daarmee de totale afstand. Als je ziet dat er grote onbedoelde variatie in hoogte is dan is het wellicht verstandig om eerst meer tijd te spenderen aan het verbeteren van je vluchtcontrole.", "v": "Voeg afstanden toe, maak de marges kleiner of groter afhankelijk van je niveau, wissel fairway en rough situaties met elkaar af voor extra aanpassingsvermogen en doe deze oefening met vooraf bepaalde vluchthoogtes. Maak er een completion drill van door alle afstanden te voltooien of maak er een scorekaart opdracht van door vanaf elke plek 1 bal te slaan waarbij het raken van de landingszone 1 punt is en doe dat rondje 5 keer waardoor je in totaal 20 slagen hebt gedaan."}, {"n": "Funny lies", "c": "Hoge approach", "t": "skill", "g": "In deze oefening gaan we leren een ligging te lezen en wat deze ligging voor effect heeft op de vlucht en reactie van de bal op de green. Daarnaast ga je trainen hoe de uitvoering van de slag hierop aan te passen. Het lezen van een ligging, een goed voorspellend vermogen hebben en vervolgens de uitvoering kunnen aanpassen aan een bepaalde situatie zijn essentiële vaardigheden om zo veel mogelijk situaties succesvol op te kunnen lossen.", "d": "Zoek onderstaande liggingen op en speel meerdere hoge approaches naar eenzelfde doel. Probeer vooraf te beredeneren wat het gevolg van deze liggen zal zijn op de launch karakteristieken van de bal zoals: horizontal launch (vertrekrichting), launch vertical (vertrekhoek), spin, spinas, balsnelheid en probeer aan de hand van deze informatie eveneens de vlucht en de reactie van de bal op de green te voorspellen. \n\nWe onderscheiden de volgende situaties:\n\n\n\n\n\n\n\nExperimenteer met veel verschillende liggingen en wees niet bang om in dit proces vaak te ‘falen’, immers liever in training mee geëxperimenteerd en leren wat wel en niet kan dan dit in de wedstrijd uit te moeten vinden.", "v": "Experimenteer met veel verschillende liggingen"}, {"n": "Pionnenjacht", "c": "Lage approach", "t": "performance", "g": "Jezelf uitdagen in realistische spelsituaties en ontdekken in welke situaties jij jouw scherpe maar realistische doelen kunt halen en welke nog niet en dus eventueel extra aandacht behoeven.", "d": "Kies zelf een aantal veel voorkomende spelsituaties waarbij lage en hoge approaches door elkaar gespeeld worden en markeer de speelplekken met een pion (tee). Speel met 3 ballen per situatie per keer en stel jezelf een scherp maar realistisch doel wanneer jij tevreden bent met wat je wilt bereiken met deze 3 ballen. Een voorbeeld zou kunnen zijn: “ik wil 2 van de 3 ballen binnen 2 clublengten van de hole laten eindigen” of “alle drie binnen 3 clublengten”. Wanneer je het doel gehaald hebt mag je de pion weghalen en hoef je daar niet meer terug te komen, wanneer het doel niet gehaald is dan ga je door naar een andere situatie en dan kom je later weer terug voor een herkansing. Probeer alle situaties weg te spelen binnen een door jou gestelde tijd. Evalueer na de oefening welke situaties naar wens gingen en welke niet, kijk eveneens naar wat hier onderliggende redenen voor kunnen zijn en wat voor acties je naar aanleiding van deze oefening moet gaan doen om verder te verbeteren.", "v": "Varieer met aantal ballen per situatie, liggingen, afstanden en doelstellingen. Voeg andere spelsituaties zoals bunkerschoten, wedges en/of lobshots toe aan het parcours."}, {"n": "Hole out", "c": "Lage approach", "t": "performance", "g": "Door in je training te trainen op uitholen zal je dit ook steeds meer voor je zien tijdens het spelen en zodoende meer ballen daadwerkelijk uitholen dan wel dichter bij de hole laten eindigen.", "d": "Start bij deze oefening met wat voor jou eenvoudige chips zoals korte lage approaches van ±10 meter. Speel met 3 ballen en geef jezelf een bepaalde tijd, bijvoorbeeld 15 minuten, om in die tijd zoveel mogelijk van deze shots uit te holen. Of stel jezelf als doel om x ballen uit te holen en geef jezelf hier 30 minuten de tijd voor. Naar gelang je beter wordt kan je meer variatie en uitdaging in de situaties brengen.", "v": "Varieer met het aantal ballen die je per situatie mag spelen, varieer met afstanden en liggingen, voeg slagsoorten toe (laag, hoog, bunker) en hou bij hoeveel je van welke situatie hebt uitgeholed, speel tegen iemand anders en doe een wedstrijd wie als eerst (of in de minste slagen) op een parcours met x lage, x hoge en x bunkerschoten alle situaties heeft uitgeholed, etc."}, {"n": "5 binnen 25", "c": "Lage approach", "t": "performance", "g": "Inzicht krijgen of je vaardig genoeg bent om meerdere ballen achter elkaar dicht bij de hole te spelen.", "d": "Kies 5 verschillende lage of hoge approaches tussen de 10 en 30 meter. Het doel is om de totale restafstand van deze 5 schoten binnen 25ft te houden. Speel het schot en meet de restafstand tot aan de hole en trek deze van de oorspronkelijk 25 af, lukt het om na 5 schoten nog wat over te hebben? Niet gelukt? Start opnieuw, je krijgt 5 ‘starts’ om deze opdracht te voltooien.", "v": "Naast dat je dit met 5 lage of hoge approaches kunt doen kan je dit principe natuurlijk ook op andere slagsoorten toepassen of deze toevoegen aan de 5 te spelen situaties en verder kan je de totale restafstand en/of het aantal schoten aanpassen."}, {"n": "Basistechniek bunkerslag", "c": "Bunker", "t": "techniek", "g": "Een belangrijk onderdeel van technisch goed onderlegd zijn en vooral ook blijven is met grote regelmaat de ogenschijnlijk simpele dingen heel goed doen. Basisvoorwaarden als een goed concept hebben over wat je wilt bereiken met de bal en zodoende impact, set up, oplijnen, het vasthouden van de club en de uiteindelijke beweging passend bij het schot kunnen hierbij veelvuldig de revue passeren. Het aanleren en vervolgens goed onderhouden van jouw basistechniek van een standaard bunkerslag is zodoende dan ook van groot belang.", "d": "De intentie is om de bal met een medium hoogte bunkerslag uit de bunker te spelen, kies zodoende ook een situatie die daadwerkelijk uitnodigt om dit schot te spelen. Een vlakke ligging op minimaal 2m afstand van de rand van de bunker en 10-25 meter van de hole is een prima uitgangspositie. Voor deze slag gebruiken we een sand- of lobwedge afhankelijk van jouw wedge set up. Speel de bal naar de hole waarbij je aandacht besteed aan het hele plaatje zoals je dat met jouw coach geschetst hebt te denken aan: de intentie wat je wilt met de bal, beginstand, beweging en eindstand. Hierbij kan gedacht worden aan:\n\nClubblad open\nBrede stand breedte\nVoorste voet een ±45 graden naar het doel gedraaid (geflared)\nNeus op de plek waar je het zand wilt raken\nAfhankelijk van de zandcondities meer of minder gewicht op links maar over het algemeen 60-40\nBalpositie aan doelzijde van borstbeen\nShaft verticaal\n‘Polsset’ combinatie van polsknik en onderarm rotatie vroeg in de achterzwaai\n‘U shape’ swing\nBovenlichaam mee laten draaien op een stabiele basis\nRelease waarbij je de loft op de club houdt\nGelijkmatig tempo\nZwaailengte symmetrisch houden", "v": "Vanuit deze standaarduitvoering zijn er vele variaties mogelijk, experimenteer bijvoorbeeld met de balpositie, afstand tot de bal, bladstand, verschillende wedges, etc. en observeer het effect hiervan op de balvlucht en rol. Experimenteer ook eens met een radicaal andere club zoals een ijzer 9, 7 of 5, welke parameters moet je dan aanpassen om een functionele bunkerslag uit te voeren?"}, {"n": "Smile to the clubface", "c": "Bunker", "t": "techniek", "g": "Leren met een open blad te spelen en zodoende de loft en bounce op de club te houden.", "d": "Teken met een marker een smiley op je clubface. Adresseer voor een standaard bunkerschot. Maak een paar slow motion oefenswings waarbij je kan controleren of je in de beginstand, top achterzwaai, impact en in de eindstand de smiley recht aan kunt kijken. Op deze manier hou je het blad gedurende de gehele beweging open. Wanneer je het gevoel voor de beweging hebt speel je een bal met hetzelfde gevoel, controleer in de eindstand of je de smiley wederom recht kunt aankijken.", "v": "Doe deze oefening ook eens met alleen lead en trail hand"}, {"n": "Trail arm", "c": "Bunker", "t": "techniek", "g": "In deze oefening ga je trainen op een functionele trail arm (rechts voor een rechtshandige speler) en handactie, alsmede de samenwerking met de lichaamsactie en tempo van de beweging.", "d": "Kies een bunkersituatie van ±10-15m met een vlakke ligging op minimaal 2m afstand van de rand van de bunker. Voor deze oefening gebruiken we een sand- of lobwedge afhankelijk van jouw wedge set up. Adresseer voor een standaard bunkerschot (zie baseline bunkerslag). Haal vervolgens je lead hand (links voor rechtshandige spelers) van de club en plaats deze op de trail bovenarm (rechts voor rechtshandige spelers). Speel vanuit deze beginstand de bal met een vloeiende beweging van 9 tot 3 uit de bunker waarbij je zorgt dat je trail arm contact houdt met je bovenlichaam.", "v": "Als dit nog te uitdagend is vanuit een normale ligging dan kan je de bal op een klein hoopje zand leggen."}, {"n": "Axis", "c": "Bunker", "t": "techniek", "g": "Teveel en/of inconsistente laterale beweging kan leiden tot inconsistent zandcontact en zodoende bemoeilijken om uit de bunker te komen dan wel enige controle te hebben over afstand, hoogte en spin. In deze oefening ga je trainen om rond 1-as te bewegen met als doel om de kans op consistent zandcontact te vergroten.", "d": "Kies een bunkersituatie van ±10-20m met een vlakke ligging op minimaal 2m afstand van de rand van de bunker. Voor deze oefening gebruiken we een sand- of lobwedge afhankelijk van jouw wedge set up. Adresseer voor een standaard bunkerschot (zie baseline bunkerslag) met de bal tegenover je voorste voet (links voor rechtshandige spelers) en zet vervolgens je achterste voet (rechts voor rechtshandige spelers) op de punt achter je. Speel vanuit deze beginstand de bal uit de bunker waarbij je je balans kunt houden tot en met de eindstand.", "v": "Als je het moeilijk vindt om op 1 been te balanceren dan kan je ook een stok in de grond naast je hoofd plaatsen waardoor je deze zal raken als je teveel van het doel weg beweegt."}, {"n": "Lowpoint conrol", "c": "Bunker", "t": "skill", "g": "In deze oefening ga je trainen om het laagste punt van de zwaai, ook wel low point genoemd, zowel horizontaal als verticaal (zwaaidiepte) op een functionele plek ten opzichte van de bal te hebben. Ook in de bunker is het belangrijk om controle te hebben over het laagste punt van de zwaai. Dit heeft namelijk veel invloed op de plek waar de club het zand in gaat (entry point) alsmede hoe diep de club het zand in zal gaan en zodoende dus veel invloed op hoeveel energie over gebracht kan worden op de bal. Deze oefening is gericht hoe deze te beïnvloeden.", "d": "Kies een bunkersituatie van ±20 meter met een vlakke ligging en wat afstand tot de rand van de bunker.\n\nOpdracht 1: sla de bal vanuit een baseline set up clean uit de bunker waarbij er nagenoeg geen zandcontact is\nOpdracht 2: sla de bal vanuit een baseline set up ‘zwaar’ uit de bunker waarbij er vrij diep zandcontact is\nOpdracht 3: sla de bal vanuit een baseline set up ‘licht uit de bunker waarbij er vrij ondiep zandcontact is\n\nBij deze oefening heb je alle ruimte om voor elke opdracht oefenswings te maken om het voorgeschreven zandcontact op te zoeken. Maak bijvoorbeeld oefenswings totdat je 3x achter elkaar het gewenste zandcontact hebt en sla daarna je bal met dezelfde intentie. Is dit 2x achter elkaar gelukt met bal, ga dan door naar de volgende opdracht, lukt het niet dan kan je wat langer bij eenzelfde opdracht blijven. Lukt het helemaal niet, laat een professional je helpen.", "v": "Maak een tee van zand en speel de bal met je normale bunkertechniek. Maak 5 diepte categorieën waarbij 1 clean of the top is en 5 voor vrij diep in het zand staat, 3 zit hier tussenin, 2 is dan ondiep en 4 net wat zwaarder."}, {"n": "Flight control", "c": "Bunker", "t": "skill", "g": "De hoogte waarmee een schot gespeeld wordt zal onder andere veel invloed hebben op de hoeveelheid rol die de bal zal krijgen en zodoende uiteindelijk ook op de totale afstand. In deze oefening gaan we trainen om de vertrekhoek en daarmee de hoogte van de bal te beïnvloeden.", "d": "Kies een bunkersituatie van 10-20 meter met een vlakke ligging en wat afstand tot de rand van de bunker. Het doel is om de bal binnen 3 meter van de hole te laten eindigen met achtereenvolgend een lagere, hogere en medium balvlucht. Het gaat hierbij om subtiele verschillen van bijvoorbeeld 1 meter hoog, 3 meter hoog en 2 meter hoog maar schroom niet om ook eens de extremen op te zoeken om te kijken hoe hoog je de bal uit de bunker kunt krijgen over een bepaalde afstand.\n\nEr zijn verscheidene factoren die de uiteindelijke hoogte van de bal bepalen en zodoende ook verscheidene manieren om de hoogte van de bal te beïnvloeden. Twee van die factoren waar we in deze oefening de nadruk leggen is de hoeveelheid loft op impact (dynamische loft) en de snelheid. De dynamische loft kunnen we onder andere beïnvloeden door:\nClubkeuze\nBladstand en shaftlean in set up (statisch)\nRelease (dynamisch)\nEen combinatie van bovenstaande\n\nOpdracht 1: speel achtereenvolgens de bal met je gap wedge (of pitching wedge), lob wedge en sand wedge om drie verschillende vluchthoogtes te krijgen en de bal binnen 2 meter van de hole te laten eindigen.\n\nOpdracht 2: speel achtereenvolgens de bal met een recht blad en verticale shaft, flink open blad en weg van het doel leunende shaft, licht open blad en verticale shaft.\n\nOpdracht 3: speel vanuit een standaardbeginstand achtereenvolgens de bal waarbij de grip voor het clubhoofd blijft door impact en een bal waarbij het clubhoofd de grip inhaalt door impact.", "v": "Experimenteer eens met combinaties van clubkeuze, statische en dynamische aanpassingen en observeer de verschillen in balvlucht. Een tourstick met een touwtje kan dienen als obstakel om de bal onder- of bovenlangs te spelen. Voeg de component snelheid toe, kijk wat er gebeurt met de hoogte wanneer je de bal met meer of minder snelheid speelt."}, {"n": "Funny lies", "c": "Bunker", "t": "skill", "g": "In deze oefening gaan we leren een ligging te lezen en wat deze ligging voor effect heeft op de vlucht en reactie van de bal op de green. Daarnaast ga je trainen hoe de uitvoering van de slag hierop aan te passen. Het lezen van een ligging, een goed voorspellend vermogen hebben en vervolgens de uitvoering kunnen aanpassen aan een bepaalde situatie zijn essentiële vaardigheden om zo veel mogelijk situaties succesvol op te kunnen lossen.", "d": "Zoek onderstaande liggingen op en speel meerdere hoge approaches naar eenzelfde doel. Probeer vooraf te beredeneren wat het gevolg van deze liggen zal zijn op de launch karakteristieken van de bal zoals: horizontal launch (vertrekrichting), launch vertical (vertrekhoek), spin, spinas, balsnelheid en probeer aan de hand van deze informatie eveneens de vlucht en de reactie van de bal op de green te voorspellen. \n\nWe onderscheiden de volgende situaties:\n\n\n\n\n\n\n\nExperimenteer met veel verschillende liggingen en wees niet bang om in dit proces vaak te ‘falen’, immers liever in training mee geëxperimenteerd en leren wat wel en niet kan dan dit in de wedstrijd uit te moeten vinden.", "v": "Experimenteer met veel verschillende liggingen"}, {"n": "Spot on", "c": "Bunker", "t": "performance", "g": "De uiteindelijke afstand van de bal wordt door vele factoren bepaald, een aantal hiervan zijn de carry, hoogte en spin van de bal. In deze oefening ga je trainen om de carry, hoogte en spin te matchen om de bal bij de hole te laten eindigen.", "d": "Markeer 3 landing zones van elk 2 meter diep voor een vlag op ±20 meter afstand van de speelplek, Het doel is om achter elkaar de landingsgebieden te raken en de bal binnen 2 meter van de hole te laten eindigen. Hierbij zal de hoogte, carry en spin waarmee de bal gespeeld wordt dus goed op elkaar afgestemd moeten zijn. In deze ‘completion drill’ ben je klaar als dit achter elkaar gelukt is. Stel jezelf een doel binnen hoeveel tijd de opdracht voltooid moet zijn.", "v": "In deze oefening kan gevarieerd worden in de afstand van de speelplek t.o.v. de hole (of meerdere speelplekken achter elkaar), de diepte van de landingszones, hoe ver de bal van de hole mag eindigen, de tijd die je erover mag doen."}, {"n": "Worst ball", "c": "Bunker", "t": "performance", "g": "1 bal dicht bij de hole kan geluk zijn, meerdere achter elkaar is geen geluk meer. In deze oefening ga je testen of je vaardig genoeg bent om meerdere ballen achter elkaar dicht bij de hole te spelen.", "d": "Je speelt 3 ballen per spelsituatie, kies van deze 3 ballen de minst goede en probeer hier up & down mee te maken. Als je één van de drie uitholed telt deze als up & down ondanks dat dit dan de beste bal is. Speel 9 verschillende bunkerschoten tussen de 10 en 30m (bijvoorbeeld 3 vlak, 3 uphill, 3 downhill). Hoeveel up en downs kan je maken?", "v": "Bovenstaand is een scorekaart oefening gericht op up & downs je kunt ook de totale restafstand van je 9 minst goede ballen bijhouden en monitoren of dit over tijd steeds minder wordt. In plaats van een scorekaart opdracht kan je er ook een completion drill van maken door te proberen x up en downs gemaakt te hebben."}, {"n": "Play as it lies", "c": "Bunker", "t": "performance", "g": "Jezelf confronteren met de randomness van het spel en zodoende een veelvoud aan verschillende liggingen treffen waarbij je al je skills en aanpassingsvermogen nodig hebt om een resultaat te behalen.", "d": "Kies een willekeurige vlag op de bunkergreen. Pak 9 ballen in je handen en ga met je rug naar de bunker staan, gooi vervolgens in 1 worp alle 9 ballen blind in de bunker. Speel vervolgens alle 9 ballen zoals je ze aantreft naar dezelfde vlag op de green en blijf dit proces herhalen totdat je in totaal 6 ballen binnen 3 meter van de hole hebt geslagen. Geef jezelf hier een half uur de tijd voor om deze opdracht te voltooien. Pas de doelstelling aan op jouw niveau en hou deze scherp maar realistisch. Evalueer welke liggingen je goed afgaan en welke minder.", "v": "Pas de doelstelling aan: resultaat t.o.v. de hole groter of kleiner, x van de 9 binnen y. Kies een meer of minder uitdagende vlag en gooi de ballen vanuit een andere hoek in de bunker."}, {"n": "Basistechniek distance wedge", "c": "Distance wedge", "t": "techniek", "g": "Een belangrijk onderdeel van technisch goed onderlegd zijn en vooral ook blijven is met grote regelmaat de ogenschijnlijk simpele dingen heel goed doen. Basisvoorwaarden als een goed concept hebben over wat je wilt bereiken met de bal en zodoende impact, set up, oplijnen, het vasthouden van de club en de uiteindelijke beweging passend bij het schot kunnen hierbij veelvuldig de revue passeren. Het aanleren en vervolgens goed onderhouden van jouw basistechniek van een standaard distance wedge is zodoende dan ook van groot belang.", "d": "De intentie is om distance wedge schot te spelen (lange vluchtfase en weinig rol), kies zodoende ook een situatie die daadwerkelijk uitnodigt om dit schot te spelen. Een fairway ligging op ±30-90 meter van de hole. Voor deze slag gebruiken we afhankelijk van jouw afstanden en wedge set up een pitching-, gap-, sand- of lobwedge. Leg een tourstick op de grond tussen je voeten en de bal, parallel aan de bal-doellijn. Gebruik deze tourstick om de stand van het clubblad en je lichaamslijnen te controleren en zo nodig aan te passen. Vervolgens speel je de bal naar de hole waarbij je aandacht besteed aan het hele plaatje zoals je dat met jouw coach geschetst hebt te denken aan: de intentie wat je wilt met de bal, beginstand, beweging en eindstand. Hierbij kan gedacht worden aan:\n\nClubblad recht op doel\nStandbreedte: buitenkant heupen buitenkant voeten\nGewicht met mate naar het voorste been door je borstbeen wat naar deze zijde te laten leunen\nVoorste voet een ±30 graden naar het doel gedraaid (geflared)\nBalpositie binnenkant linkerhiel\nGrip voorkant bal\nSamenwerking van handen, armen en lichaam\nClub on plane\nBeetje set\nExtensie in de doorzwaai", "v": "Vanuit deze standaarduitvoering zijn er vele variaties mogelijk, experimenteer bijvoorbeeld met de balpositie, afstand tot de bal, bladstand, verschillende wedges, etc. en observeer het effect hiervan op de balvlucht en rol."}, {"n": "Sleeppush", "c": "Distance wedge", "t": "techniek", "g": "In deze oefening ga je trainen op een correcte lichaamsactie, samenwerking tussen lichaam en armen door de bal heen en het passeren van de gewenste impactpositie in de beweging.", "d": "Doe deze oefening met een wedge op de range of zoek een situatie met een vlakke fairway ligging op 40-60m tot de vlag. Maak een aantal oefenbewegingen waarbij je de club naast je (trail side) op de grond plaatst en vervolgens over de grond sleept naar een eindstand (zie video). Zorg dat lichaam, armen en handen de club gezamenlijk naar de eindstand brengen en voel dat de shaft lichtjes naar het doel leunt wanneer je impact passeert. Herhaal dit een paar keer en sla vervolgens je bal met hetzelfde gevoel.", "v": "Maak een video opname van de sleeppush en van de daadwerkelijke uitvoering om zelf te kunnen controleren of je de oefening goed uitvoert. Je kunt deze oefening ook doen door met een pw echt een bal te slepen, welke carry kan je halen?"}, {"n": "Lowpoint control", "c": "Distance wedge", "t": "skill", "g": "In deze oefening ga je trainen om het laagste punt van de zwaai, ook wel low point genoemd, zowel horizontaal als verticaal (zwaaidiepte) op een functionele plek ten opzichte van de bal te hebben. Met name de verticale component heeft enorm veel invloed op het grondcontact van de club en zodoende veel invloed op de kwaliteit van het contact met de bal. Het is dus van groot belang om hier controle over te hebben.", "d": "Kies een bunker op distance wedge afstand van de hole ±30m tot maximaal volle pitchingwedge afstand, voor deze oefening is een meter of 50 een prima startsituatie. Creëer een compact stukje zand in de bunker met behulp van de achterkant van de hark. Plaats de bal bovenop en speel de bal met een wedge slag (bij voorkeur met een halve of driekwart) naar het doel waarbij je de intentie hebt om de bal clean en zuiver te raken. Evalueer na elke slag het ‘entry point’ van de club in het zand alsmede de diepte van de slag en pas deze zo nodig dusdanig aan dat een zuiver contact met ondiepe ‘plag’ het gevolg is.", "v": "Door een bal vanaf een hoge tee te spelen train je ook je zwaaidiepte"}, {"n": "Flight control", "c": "Distance wedge", "t": "skill", "g": "De vertrekhoek (launch angle) waarmee een distance wedge gespeeld wordt zal onder andere veel invloed hebben op de hoogte en spin (en zodoende op de hoeveelheid rol) van de bal en zodoende uiteindelijk ook op de totale afstand. In deze oefening gaan we trainen op een launch angle van ±30 graden wat een goede richtlijn is voor standaard distance wedge schoten.", "d": "Voor deze oefening heb je 2 toursticks nodig, schone groeven, een fairway ligging waarbij er bij een goed contact geen vuil of gras tussen bal en club komt (een kunstgras afslagplek kan natuurlijk ook). Maak met de toursticks een ‘goal’ door deze op 1,5 meter afstand van de speelplek te plaatsen met het touwtje als ‘lat’ op 1 meter hoogte van de grond. 1 meter hoog op 1,5 meter afstand staat voor een vertrekhoek van ± 34 graden en het doel is om de bal onder de ‘lat’ door te laten vertrekken. 3 keer achter elkaar gelukt? Leg dan je de bal 25 centimeter naar achteren en speel de bal met dezelfde intentie.", "v": "Probeer de bal op verschillende hoogtes te lanceren"}, {"n": "Carry", "c": "Distance wedge", "t": "skill", "g": "De afstand die de bal door de lucht vliegt, de carry, is een belangrijke component die bijdraagt aan de totale afstand van de bal, het is dus van belang dat je hier controle over krijgt. In deze oefening ga je trainen om de carry naar wens te beïnvloeden.", "d": "Voor deze oefening maak je een landingsgebied op de green of op een stuk fairway van ±3m diep (voor betere feedback kan je hier ook een stuk afdekzeil voor gebruiken). Markeer verschillende afstanden t.o.v. het landingsgebied die je wilt gaan trainen, bijvoorbeeld 30, 40, 50 en 60 meter, dit kan zowel op de fairway als uit de rough zijn afhankelijk van welke ligging je wilt gaan trainen. Begin bij de eerste afstand en speel respectievelijk 1 bal voorbij het landingsgebied, de volgende ervoor en de laatste in het landingsgebied. Is dit gelukt ga je door naar de volgende afstand. Start met de opdracht in serie te doen (van voor naar achter werken) en wanneer dit goed lukt dan ga je meer variabel te werk bijvoorbeeld 40, 60, 30, 50. Hoe beter je wordt hoe kleiner je de marges van voorbij, voor en de uiteindelijke landingszone kunt maken.\n\nOm uiteindelijk nog beter te worden is het aan te raden om scherp te zijn op de variatie in hoogte waarmee je de bal speelt, hoe constanter deze is hoe constanter de landingshoek en hoe voorspelbaarder de hoeveelheid rol zal zijn en daarmee de totale afstand. Als je ziet dat er grote onbedoelde variatie in hoogte is dan is het wellicht verstandig om eerst meer tijd te spenderen aan het verbeteren van je vluchtcontrole.", "v": "Voeg afstanden toe, maak de diepte van het landingsgebied groter of kleiner, maak de marges van voorbij en voor kleiner of groter afhankelijk van je niveau, wissel fairway en rough situaties met elkaar af voor extra aanpassingsvermogen en doe deze oefening met vooraf bepaalde vluchthoogtes. Maak er een completion drill van door alle afstanden te voltooien of maak er een scorekaart opdracht van door vanaf elke plek 1 bal te slaan waarbij het raken van de landingszone 1 punt is en doe dat rondje 5 keer waardoor je in totaal 20 slagen hebt gedaan."}, {"n": "Basecamp & set up check", "c": "Full swing", "t": "techniek", "g": "Een belangrijk onderdeel van technisch goed onderlegd zijn en vooral ook blijven is met grote regelmaat de ogenschijnlijk simpele dingen heel goed doen. Basisvoorwaarden als een goed concept hebben over wat je wilt bereiken met de bal en zodoende impact, set up, oplijnen, het vasthouden van de club en de uiteindelijke beweging passend bij het schot dienen hierbij veelvuldig de revue te passeren. Hoewel een swing voor een groot deel een persoonlijke aangelegenheid is, is het onderhouden van een goede uitgangspositie voor iedereen een zinvolle tijdsbesteding, immers een goede uitgangspositie is een basisvoorwaarde voor goed bewegen. Dit is een van de redenen waarom je veel tourspelers veelvuldig zult zien trainen met toursticks en andere toevoegingen", "d": "Bepaal samen met jouw coach een goede uitgangspositie voor jou en creëer samen een ‘basisstation’ die jou helpt om deze beginstand zorgvuldig te kunnen trainen en onderhouden. \n\nHierbij kan gedacht worden aan een ‘T’ opstelling met toursticks waarbij je de volgende zaken kunt controleren:\n\nClubbladstand in de richting waarin je wilt dat de bal vertrekt\nGrip\nStandbreedte en voetflare\nLichaamslijnen (voeten, knieën, heupen, torso, schouders, ogen)\nBalpositie\nShaftlean\nBalans: lead/trail en voor/achter\nHouding", "v": "Maak een foto/video van jezelf om te kijken of je staat zoals jij dit met jouw coach hebt afgesproken."}, {"n": "Bends & tilts", "c": "Full swing", "t": "techniek", "g": "Hoe de speler de club beweegt heeft invloed op de lichaamsactie en andersom, een effectieve lichaamsactie heeft zowel een positief invloed op de controle van de club als op de snelheid die gegenereerd kan worden. Deze oefening is erop gericht om een goed begrip en gevoel te krijgen hoe het lichaam in 3 dimensies beweegt in de golfswing.", "d": "Voor deze oefening heb je een hoepel nodig en 4 toursticks die je 2 aan 2 aan elkaar bevestigt met een elastiekje. Zoek een plek met een spiegel en positioneer jezelf zo dat je jezelf vanaf de zijkant (down the line) in de spiegel kunt zien. Pak de hoepel en plaats deze over je hoofd op schouderhoogte haaks op je wervelkolom en neem vervolgens je beginstand in. Vanuit deze positie ga je in slot motion een swing maken waarbij de hoepel in hetzelfde ‘vlak’ blijft. Om dit voor elkaar te krijgen zal het lichaam in de juiste verhoudingen 3 bewegingen naadloos moeten combineren te weten roteren (draaien om je lengteas), lateroflexie (zijwaarts buigen om je dwarse as) en flexie/extensie (voor- en achterwaarts buigen om je breedte as). Zodra je hier een goed gevoel voor hebt ga je door naar de oefening met club.\n\nZet twee lange stokken voor je neer in een hoek die haaks is op je wervelkolom in de set up en met wat ruimte ten opzichte van elkaar waar je hoofd royaal tussen past. Plak 2 stickers boven op elke schouder en maak nu oefenswings waarbij je voelt dat stickers in de vorm van de hoepel bewegen. Heb je hier een gevoel voor gekregen dan kan je een bal gaan slaan met dit gevoel. Begin met korte ijzers en kleinere swings.\n\nOpmerking: pas op met de uiteindes van de stokken, vaak een goed idee om hier wat bescherming op te monteren. Kom je er niet uit raadpleeg dan je eigen coach om je hierbij te helpen.", "v": "Je kunt ook prima middels fysieke oefeningen aan dit principe werken door bijvoorbeeld 2 elastieken voor je op de grond te bevestigen en vervolgens de uiteinden vast te pakken en je beginstand in te nemen. Vanuit je beginstand trek je het elastiek naar achteren en omhoog, eerst je backswingkant en vervolgens je downswing kant."}, {"n": "Rocking", "c": "Full swing", "t": "techniek", "g": "In elke golfswing vindt drukoverdracht plaats, in een effectieve golfswing gaat de druk onder de voeten in een vroeg stadium van de backswing naar rechts en vanaf gedurende de backswing alweer terug naar links. Deze oefening is erop gericht om deze effectieve ‘pressure’ shift te ontwikkelen en zodoende goed balcontact en snelheid te bevorderen.", "d": "Voor deze oefening heb je een rocking board nodig, dit is een plankje met een klein latje eronder waardoor dit een soort wipwap wordt. Ga op het plankje staan en neem je beginhouding in waarbij het voorste deel van het plankje op de grond rust. Vervolgens start je de backswing en beweegt de druk naar je trail side toe (rechts voor rechtshandige spelers) waardoor het plankje nu met de andere kant op de grond komt. Voordat de backswing geëindigd is beweeg je weer terug naar links waardoor de voorzijde van het plankje wederom op de grond komt waarna je de bal raakt.", "v": "Een variatie op deze oefening waarbij je geen bord nodig hebt is de dubbele stap. Maak een beginstand met je voeten tegen elkaar en bal tegenover je voorste voet. Neem vervolgens in een vloeiende beweging met je achterste voet (rechts voor rechtshandige spelers) eerst een stap opzij waarna je vervolgens de club in beweging brengt, halverwege de backswing zet je met je voorste voet een stap opzij en maak je de swing af naar de eindstand."}, {"n": "Sequence", "c": "Full swing", "t": "techniek", "g": "We kunnen de golfer in een aantal verschillende grove segmenten opdelen te weten onderlichaam, torso, armen en club, deze segmenten kunnen in een bepaalde volgorde t.o.v. elkaar bewegen, dit wordt ook wel de kinematische volgorde genoemd. In een efficiënte golfswing gaat in de transitie (overgang van backswing naar downswing) eerst het onderlichaam roteren, gevolgd door de torso, daarna komen de armen en als laatste de club. Deze oefening is erop gericht om een efficiënte kinematische volgorde te ontwikkelen.", "d": "Start bij deze oefening met een mid ijzer. Neem je normale beginstand in, zet vervolgens je voorste voet (links voor een rechtshandige speler) naast je achterste voet en breng de club vervolgens in een positie voorbij de bal ±8 uur. Vanuit deze stand start je de backswing en ±halverwege de achterzwaai stap je uit met je voorste voet naar de originele positie van je normale beginstand en maak je de swing af naar een eindstand waarbij je de bal tegenkomt op de route.", "v": "Oefen deze beweging ook eens door met een (medicine) bal tegen de muur te gooien."}, {"n": "Lowpoint control", "c": "Full swing", "t": "skill", "g": "In deze oefening ga je trainen om het laagste punt van de zwaai, ook wel low point genoemd, zowel horizontaal als verticaal (zwaaidiepte) op een functionele plek ten opzichte van de bal te hebben.", "d": "Evalueer na elke slag het ‘entry point’ van de club in het zand alsmede de diepte van de slag en pas deze zo nodig dusdanig aan dat een zuiver contact met ondiepe ‘plag’ het gevolg is.", "v": "Door een bal vanaf een hoge tee te spelen train je ook je zwaaidiepte"}, {"n": "9 ball", "c": "Full swing", "t": "skill", "g": "Trainen om de startrichting, curve en hoogte van de bal naar wens te beïnvloeden. Ondanks dat topspelers veelal een standaard balvlucht hebben in de vorm van een draw of fade met een bepaalde hoogte zijn zij over het algemeen in staat om desgevraagd een bepaalde vlucht te spelen waar het schot om vraagt. Denk hierbij bijvoorbeeld aan het spelen van een bepaalde hoogte en curve om obstakels te ontwijken of een bal onder of in de wind te houden. In deze oefening ga je 9 verschillende balvluchten trainen, enerzijds om je vaardigheidsniveau te vergroten, anderzijds om met deze kennis over je vaardigheid slimme keuzes te maken in de baan.", "d": "De opdracht is om met een mid ijzer negen balvluchten te spelen, te weten:\nDraw: laag, hoog, midden\nFade: laag, hoog, midden\nRecht: laag, hoog, midden\n\nKies een doel en plaats een tourstick op ±5 meter afstand op de bal doellijn. Speel achtereenvolgens alle balvluchten in bovenstaande (of zelf gekozen) volgorde, spreek met jezelf een aantal pogingen per vlucht af waarna je door mag naar de volgende ondanks dat het misschien niet gelukt is. Evalueer welke vluchten jou goed en welke vluchten jou minder goed afgaan.\n\nOpmerking: mocht je niet goed weten hoe jij de balvlucht naar wens zou kunnen beïnvloeden neem dit dan eerst door met je eigen coach.", "v": "Doe deze oefeningen met andere clubs, of wissel van clubs tijdens een set balvluchten. Maak er een performance oefening van door op deze manier een balvlucht versie van boter kaas en eieren te spelen tegen een medespeler, of een scorekaart opdracht door te tellen hoeveel slagen je nodig hebt om alle vluchten af te kunnen vinken."}, {"n": "Funny lies", "c": "Full swing", "t": "skill", "g": "In deze oefening gaan we leren een ligging te lezen en wat deze ligging voor effect heeft op de vlucht en reactie van de bal op de green. Daarnaast ga je trainen hoe de uitvoering van de slag hierop aan te passen. Het lezen van een ligging, een goed voorspellend vermogen hebben en vervolgens de uitvoering kunnen aanpassen aan een bepaalde situatie zijn essentiële vaardigheden om zo veel mogelijk situaties succesvol op te kunnen lossen.", "d": "Zoek onderstaande liggingen op en speel meerdere hoge approaches naar eenzelfde doel. Probeer vooraf te beredeneren wat het gevolg van deze liggen zal zijn op de launch karakteristieken van de bal zoals: horizontal launch (vertrekrichting), launch vertical (vertrekhoek), spin, spinas, balsnelheid en probeer aan de hand van deze informatie eveneens de vlucht en de reactie van de bal op de green te voorspellen. \n\nWe onderscheiden de volgende situaties:\n\n\n\n\n\n\nExperimenteer met veel verschillende liggingen en wees niet bang om in dit proces vaak te ‘falen’, immers liever in training mee geëxperimenteerd en leren wat wel en niet kan dan dit in de wedstrijd uit te moeten vinden.", "v": "Experimenteer met veel verschillende liggingen"}, {"n": "Complete the bag", "c": "Full swing", "t": "performance", "g": "In deze oefening ga je testen hoeveel controle je hebt over de spreiding met al je clubs uit de tas.", "d": "Kies 2 punten op de range die samen een spreidingsgebied van ±5% van de afstand vormen (dus bijvoorbeeld 2 targets die ongeveer 10 meter uit elkaar staan op 200m). Haal alle clubs uit de tas. Start met je driver en speel 3 ballen, het doel is om 3 ballen achter elkaar binnen het spreidingsgebied te laten landen. Is dat gelukt dan mag de club in de tas, is het niet gelukt dan blijft deze buiten de tas en ga je door naar de volgende club. Je herhaalt deze opdracht met alle clubs (behalve de putter uiteraard) en daarna ga je de overgebleven clubs weg proberen te spelen.", "v": "Je kunt het spreidingsgebied breder of smaller maken, meer of minder ballen per club spelen, andere doelen stellen wat je met de ballen wilt bereiken (bijvoorbeeld 2 van de 4 binnen het gebied), de ballen spelen met een specifieke curve, etc."}, {"n": "Control your miss", "c": "Full swing", "t": "performance", "g": "In deze oefening gaan we trainen om de bal bewust aan een bepaalde kant van het doel te proberen houden. Een goede golfer slaat niet alleen goede ballen maar kan zich onderscheiden door ook enige controle te hebben over waar de bal gemist wordt in het geval dat de bal niet gaat volgens plan.", "d": "In dit voorbeeld gaan we linkerkant van het doel proberen te vermijden. Kies voor deze oefening een driver, lang ijzer, mid ijzer, kort ijzer en een wedge. Bepaal een spreidingsgebied van ±5% van de afstand. Speel achtereenvolgens een bal met elke club van driver naar wedge en herhaal dit totdat je met elke club 5 ballen hebt geslagen. De puntentelling is als volgt: rechts van het doel missen -1, in het spreidingsgebied +2 en links missen is -2. Hoeveel punten heb je gehaald?", "v": "Doe dezelfde oefening maar nu met het doel om de rechterkant van het doel uit het spel te halen, je kunt er ook een completion drill van maken door een doel te stellen dat je x punten moet halen voordat je mag stoppen."}, {"n": "Par-2 test", "c": "Hoge approach", "t": "performance", "g": "Inzicht krijgen hoe jouw scorend vermogen is met betrekking tot je korte spel. In deze oefening ga je jezelf testen in verschillende short game situaties en proberen een zo laag mogelijke score te maken, door bepaalde gegevens bij te houden kan je later terugzien waar jou sterke en verbeterpunten liggen.", "d": "Doe deze oefening op rond de chippinggreen of in de (par-3) baan. Zet voor jezelf 3 lage approaches, 3 hoge approaches en 3 bunkerschoten uit kies hierbij 3 makkelijke, 3 moeilijke en 3 medium situaties qua moeilijkheidsgraad. Drop de bal op de speelplek, speel je bal en meet vervolgens de restafstand van je eerste slag tot aan de hole. Speel vervolgens door totdat de bal uitgeholed is en noteer de resultaten volgens onderstaande tabel. Wanneer je 9 holes gespeeld hebt kan je de totale score, aantal putts, totale & gemiddelde restafstand berekenen. Evalueer welke situaties goed en welke situaties minder gingen en waarom. Doe deze oefening regelmatig en hou je resultaten bij om je voortgang inzichtelijk te maken.\n\n\nOpmerking: bij normale condities wordt er gedropt, wanneer de condities minder goed zijn zoals in een onderhoudsperiode kan je ervoor kiezen om representatief te plaatsen dan wel bijvoorbeeld 3 droppogingen te hebben.", "v": "Speel in plaats van 9 holes 18 holes en voeg indien mogelijk verschillende type schoten toe zoals distance wedges en/of lobshots, noteer liggingen om ook inzicht te krijgen in je prestaties uit verschillende liggingen."}, {"n": "Proximity", "c": "Distance wedge", "t": "performance", "g": "Inzicht krijgen hoe dicht je de bal bij de vlag slaat vanaf verschillende wedge afstanden.", "d": "Doe deze oefening in de (Par-3) baan. Speel op elke hole een distance wedge vanaf een fairway ligging, met een vrije zichtlijn over een afstand tussen de 30 meter en volle pitching wedge afstand. Noteer de startligging (voor nu dus even fairway) + startafstand, speel je bal en noteer vervolgens de restligging + afstand.\n\n\nHoeveel punten heb je na 9 holes en wat was de gemiddelde afstand? Of tel de restafstand op en deel deze door de totale beginafstand en vermenigvuldig deze met 100 dan heb je je proximity percentage (22,5/136*100 = 16,5%), een tourspeler zou hierbij uit willen komen op minder dan 5%.\n\nWanneer je deze oefening regelmatig doet dan kan je deze informatie ook gebruiken om bijvoorbeeld gemiddelde afstanden en/of punten te berekenen op bepaalde afstanden en analyseren hoe deze zich ten opzichte van elkaar verhouden. Zijn er wellicht afstanden waar je beter in bent dan andere en wellicht kan je deze informatie gebruiken om weer richting te geven aan je training alsmede gebruiken om keuzes te maken in de baan.", "v": "Varieer in met de ligging van de bal (fairway en rough door elkaar), bedenk een eigen puntensysteem bijvoorbeeld gebaseerd op % van de totale afstand (binnen 5% van de afstand = x punten)."}, {"n": "Pressure putt", "c": "Putten", "t": "performance", "g": "Op weg naar topgolf zal je als speler veelvuldig geconfronteerd worden met relatief korte putts die onder enige vorm van druk gespeeld moeten worden. Nu is het lastig om deze situatie exact na te bootsen maar enige vorm van druk in je training introduceren is altijd een betere voorbereiding dan niks. Deze oefening is erop gericht om veel variatie in je training te brengen en met regelmaat een putt onder druk te moeten spelen.", "d": "Kies een hole op een enigszins geonduleerd stukje green en plaats rond deze hole 5 tees op een afstand van 1.0-1.5 meter. Elke tee staat voor een opdracht, bijvoorbeeld:\n3 10 meter putts naar eenzelfde doel, 2 ballen per situatie, doel: 4 ballen binnen 1 stoklengte\n3 hoge approach afstanden (10, 15, 20m) naar eenzelfde vlag, 2 ballen per afstand, doel: 4 ballen binnen 2 stoklengten\n3 hoge approach afstanden (15, 20, 25m) naar eenzelfde vlag, 2 ballen per afstand, doel: 4 ballen binnen 2 stoklengten\n3 bunker afstanden (15, 20, 25m) naar eenzelfde vlag, 2 ballen per afstand, doel: 4 ballen binnen 3 stoklengten\n3 lobshot afstanden (10, 20, 30m) naar eenzelfde vlag, 2 ballen per afstand, doel: 4 ballen binnen 3 stoklengten\n\nStart bij een willekeurig onderdeel en probeer de opdracht te voltooien, is dat gelukt dan mag je door naar de corresponderende ‘pressure putt’, maak je die dan is deze situatie uitgespeeld. Zo niet dan moet je deze opdracht later nogmaals proberen te halen om nog een kans te hebben de pressure putt te maken. In het geval van het niet halen van de opdracht dan wel niet holen van de pressure putt ga je door naar een andere opdracht. Zo speel je door totdat er nog maar 1 opdracht over is en deze mag je dan achter elkaar blijven doen totdat ook deze ‘uitgespeeld’ is. Zorg in eerste instantie dat de doelstellingen realistisch en haalbaar zijn en maak je opdrachten steeds uitdagender.", "v": "In deze opdracht kan je eindeloos variëren en uitbreiden met slagsoorten, doelstellingen, liggingen, afstanden, etc. Als de oefenfaciliteiten redelijk bij elkaar in de buurt liggen dan kunnen er ook lange spel elementen toegevoegd worden aan het circuit zoals drives en ijzerslagen."}, {"n": "Par-18 wedgespel", "c": "Spelen", "t": "performance", "g": "Scoren met de scoring clubs onder telling.", "d": "Speel 9 wedge-holes (elk par 2) vanaf 40–100 m. Tel je totaalscore t.o.v. par 18 en probeer te verbeteren.", "v": "Varieer afstanden en liggingen; speel tegen een medespeler."}, {"n": "Worst-ball 9 holes", "c": "Spelen", "t": "performance", "g": "Mentale weerbaarheid en consistentie onder druk.", "d": "Speel 9 holes met 2 ballen; je speelt telkens verder met de slechtste van de twee. Dwingt tot herhaalbaar spel.", "v": "Doe hetzelfde met alleen het korte spel of alleen approaches."}, {"n": "Scenario-training druk", "c": "Spelen", "t": "performance", "g": "Omgaan met wedstrijdspanning en beslissingen.", "d": "Bedenk vooraf 3 wedstrijdscenario's (bijv. laatste hole, 1 slag voorsprong). Speel ze met volledige routine en consequenties. Reflecteer na afloop.", "v": "Verhoog de inzet of speel de scenario's tegen een tegenstander."}, {"n": "Aandacht & focus", "c": "Mentaal", "t": "techniek", "g": "Bewust sturen waar je aandacht naartoe gaat voor, tijdens en na de slag.", "d": "Oefen een vast aandachtsanker (bijv. de bal-doellijn of je ademhaling). Speel 10 slagen waarbij je telkens bewust je aandacht verlegt van breed (situatie inschatten) naar smal (uitvoering).", "v": "Voeg een afleider toe (geluid, tijdsdruk) en behoud je aandachtsanker."}, {"n": "Ademhaling & reset", "c": "Mentaal", "t": "skill", "g": "Spanning reguleren tussen slagen.", "d": "Oefen een reset: na een slechte slag 3 rustige buikademhalingen + een triggerwoord. Koppel dit aan 10 slagen zodat het automatisch wordt.", "v": "Pas de reset toe direct na een bewust geforceerde misser."}, {"n": "Visualisatie voor de ronde", "c": "Mentaal", "t": "performance", "g": "Mentaal de ronde en shots voorbereiden.", "d": "Ga 5–10 min voor de start rustig zitten en speel in gedachten de eerste holes: zie de shots, voel het ritme, bevestig je gameplan.", "v": "Visualiseer ook lastige holes en je reactie op een tegenslag."}, {"n": "Rotatie-mobiliteit heup & thoracaal", "c": "Fysiek", "t": "techniek", "g": "Bewegingsvrijheid voor de swing vergroten.", "d": "Doe 3 sets van heuprotaties, thoracale openers en swingsimulaties. Neem elke rotatie rustig tot eindstand. Ideaal als warming-up.", "v": "Bouw op naar dynamische versies vlak voor het slaan."}, {"n": "Rotatiekracht met medicine ball", "c": "Fysiek", "t": "skill", "g": "Explosieve rotatiekracht ontwikkelen.", "d": "Gooi een medicine ball zijwaarts tegen een muur, 3 sets van 8 per kant, met golf-achtige rotatie. Focus op snelheid vanuit de heupen.", "v": "Wissel af met lichte/zware bal om snelheid en kracht te trainen."}, {"n": "Balans single-leg", "c": "Fysiek", "t": "techniek", "g": "Stabiliteit en balans in de swing verbeteren.", "d": "Sta 30 sec op één been (ogen dicht voor extra uitdaging), 3 sets per been. Voeg lichte swingbeweging toe voor sportspecifieke balans.", "v": "Sta op een instabiele ondergrond of maak halve swings op één been."}];
function ensureDrills(){if(state._drills){state.drills=state.drills||[];return false;}state.drills=state.drills||[];SEED_DRILLS.forEach(function(d){state.drills.push({id:uid(),name:d.n,cat:d.c,type:d.t||"techniek",goal:d.g||"",desc:d.d||"",vars:d.v||"",duration:(d.dur!=null?d.dur:null),material:d.m||"",intensity:(d.i!=null?d.i:null),tags:[],builtin:true,created:todayISO()});});state._drills=true;return true;}
function testDrills(){return ORDER.map(function(tid){var t=TESTS[tid];var c=TESTCATMAP[t.cat]||t.cat;if(tid==="bunker")c="Bunker";return {id:"test_"+tid,name:t.name,cat:c,type:"test",goal:"",desc:t.info||"",vars:"",duration:null,material:"",intensity:null,testId:tid,virtual:true};});}
function allDrills(){return (state.drills||[]).concat(testDrills());}
function intBar(n){n=+n||0;var s="";for(var i=1;i<=5;i++)s+=(i<=n?'●':'<span class="off">●</span>');return '<span class="intbar">'+s+'</span>';}
function drillSub(d){var s=d.goal||d.desc||"";if(!s)return "";s=s.replace(/\s+/g," ").trim();if(s.length>95)s=s.slice(0,95).replace(/\s\S*$/,"")+"…";return '<small class="muted" style="display:block;margin-top:1px">'+esc(s)+'</small>';}
let trainCat="",trainType="",trainQ="";
function trainFiltered(){var q=trainQ.trim().toLowerCase();return allDrills().filter(function(d){if(trainCat&&d.cat!==trainCat)return false;if(trainType&&d.type!==trainType)return false;if(q&&(d.name+" "+(d.goal||"")+" "+(d.desc||"")).toLowerCase().indexOf(q)<0)return false;return true;});}
function trainRenderList(){var box=$("#trList");if(!box)return;var list=trainFiltered();if(!list.length){box.innerHTML='<div class="empty"><div class="em">🎯</div><p>Geen oefeningen gevonden.</p></div>';return;}var groups={};list.forEach(function(d){(groups[d.cat]=groups[d.cat]||[]).push(d);});var html="";DRILLCATS.forEach(function(c){var g=groups[c];if(!g||!g.length)return;html+='<div class="trcat">'+esc(c)+' <span class="muted" style="font-weight:600">· '+g.length+'</span></div>';g.sort(function(a,b){return a.name.localeCompare(b.name,"nl");}).forEach(function(d){html+='<div class="rcard trcard" data-drill="'+d.id+'"><div class="row spread"><div style="min-width:0"><b>'+esc(d.name)+'</b>'+drillSub(d)+'</div><span class="trbadge tb-'+d.type+'">'+drillTypeLabel(d.type)+'</span></div></div>';});});box.innerHTML=html;box.querySelectorAll("[data-drill]").forEach(function(c){c.onclick=function(){drillDetail(c.dataset.drill);};});}
function renderTrain(){var box=$("#trainBody");if(!box)return;var catChips='<div class="trchips" id="trCat"><button data-c="" class="'+(trainCat===""?"on":"")+'">Alle</button>'+DRILLCATS.map(function(c){return '<button data-c="'+esc(c)+'" class="'+(trainCat===c?"on":"")+'">'+esc(c)+'</button>';}).join("")+'</div>';var typeSeg='<div class="trchips" id="trType"><button data-t="" class="'+(trainType===""?"on":"")+'">Alle</button>'+TYPEFILTERS.map(function(o){return '<button data-t="'+o[0]+'" class="'+(trainType===o[0]?"on":"")+'">'+o[1]+'</button>';}).join("")+'</div>';var head='<div class="card"><input class="in" id="trQ" placeholder="Zoek oefening…" value="'+esc(trainQ)+'"><div class="trlbl">Spelonderdeel</div>'+catChips+'<div class="trlbl">Type</div>'+typeSeg+'</div>';box.innerHTML=head+'<button class="btn block blue" id="trAdd" style="margin-bottom:6px">+ Nieuwe oefening</button><div id="trList"></div>';var _q=$("#trQ");if(_q)_q.oninput=function(){trainQ=_q.value;trainRenderList();};$("#trCat").querySelectorAll("button").forEach(function(b){b.onclick=function(){trainCat=b.dataset.c;$("#trCat").querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});trainRenderList();};});$("#trType").querySelectorAll("button").forEach(function(b){b.onclick=function(){trainType=b.dataset.t;$("#trType").querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});trainRenderList();};});var _a=$("#trAdd");if(_a)_a.onclick=function(){openDrillForm(null);};trainRenderList();}

function defInput(t){
if(t.eng==="putt_cat")return {blocks:t.dists.map(()=>({holed:0,in3:0,out3:0}))};
if(t.eng==="putt_rest")return {blocks:t.dists.map(()=>({holed:0,rest:3,_t:false}))};
if(t.eng==="putt_prox")return {blocks:t.dists.map(()=>Array.from({length:t.per},()=>({prox:"",score:""})))};
if(t.eng==="course")return {holes:Array.from({length:draft.holes},(_,i)=>({dist:(draft.courseDists&&draft.courseDists[i]!=null&&draft.courseDists[i]!=="")?draft.courseDists[i]:"",score:""}))};
if(t.eng==="sit")return {res:draft.stations.map(()=>t.hasScore?{rest:"",restLie:'g',score:""}:{rest:"",restLie:'g'})};
if(t.eng==="drivebaan")return {holes:Array.from({length:draft.dvHoles},()=>({len:"",balls:Array.from({length:draft.dvBalls},()=>({club:"D",rest:"",lie:"f",dist:"",spr:"",side:"R",chs:"",bs:""}))}))};
if(t.eng==="driverange")return {shots:Array.from({length:draft.dvShots},()=>({club:"D",spr:"",side:"R",dist:"",chs:"",bs:""}))};
if(t.eng==="spelen")return {toPar:0,_t:false};
if(t.eng==="sground"){const co=getCourse(draft.courseId);if(!co||!draft.loopIds||!draft.loopIds.length)return {courseName:co?co.name:"",teeName:draft.teeName,loopNames:[],holes:[]};let holes=[];let hn=0;draft.loopIds.forEach(lid=>{const lp=co.loops.find(l=>l.id===lid);if(!lp)return;lp.holes.forEach((h,i)=>{hn++;const L=(h.len&&h.len[draft.teeName]!=null&&h.len[draft.teeName]!=="")?+h.len[draft.teeName]:0;holes.push({hole:hn,loopName:lp.name,loopHole:i+1,par:h.par,len:L,score:""});});});return {courseName:co.name,teeName:draft.teeName,loopNames:draft.loopIds.map(id=>{const lp=co.loops.find(l=>l.id===id);return lp?lp.name:"";}),holes:holes};}}

if(t.eng==="putt_cat")body=fPuttCat(t,inp);else if(t.eng==="putt_rest")body=fPuttRest(t,inp);else if(t.eng==="putt_prox")body=fPuttProx(t,inp);
else if(t.eng==="course")body=fCourse(t,inp);else if(t.eng==="sit")body=fSit(t,inp);else if(t.eng==="spelen")body=fSpelen(t,inp);else if(t.eng==="sground")body=fSground(t,inp);else if(t.eng==="drivebaan")body=fDriveBaan(t,inp);else if(t.eng==="driverange")body=fDriveRange(t,inp);

bindForm(t,pid,inp);liveStats(t,inp);}

function pickMatch(m,f){if(f.lab&&(m.labels||[]).indexOf(f.lab)<0)return false;if(f.cat&&(m.cat||"")!==f.cat)return false;if(f.kl&&(m.klasse||"")!==f.kl)return false;if(f.tour){if(f.tour==="__none__"){if(m.tourId)return false;}else if((m.tourId||"")!==f.tour)return false;}if(f.q&&(m.name||"").toLowerCase().indexOf(f.q.toLowerCase())<0)return false;return true;}
function byName(a,b){return (a.name||"").localeCompare(b.name||"","nl");}
function byMetaName(a,b){return edMeta(a).name.localeCompare(edMeta(b).name,"nl");}
function filterCard(f,withMonth,withTour){var labs=state.tourLabels||[],cats=state.tourCats||[];var MN=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];var monSel=withMonth?'<select class="in" id="fMon" style="flex:1;min-width:88px"><option value="">Alle mnd</option>'+MN.map(function(mn,i){return '<option value="'+(i+1)+'"'+((""+f.mon)===(""+(i+1))?" selected":"")+'>'+mn+'</option>';}).join("")+'</select>':'';var tourSel=withTour?'<select class="in" id="fTour" style="flex:1;min-width:110px"><option value="">Alles</option>'+(state.tours||[]).map(function(tr){return '<option value="'+esc(tr.id)+'"'+(f.tour===tr.id?" selected":"")+'>'+esc(tr.name)+'</option>';}).join("")+'<option value="__none__"'+(f.tour==="__none__"?" selected":"")+'>Zonder tour</option></select>':'';return '<div class="card"><div class="row" style="gap:8px;flex-wrap:wrap"><select class="in" id="fLab" style="flex:1;min-width:110px"><option value="">Alle labels</option>'+labs.map(function(l){return '<option value="'+esc(l)+'"'+(f.lab===l?" selected":"")+'>'+esc(l)+'</option>';}).join("")+'</select><select class="in" id="fCat" style="flex:1;min-width:100px"><option value="">Alle cat.</option>'+cats.map(function(c){return '<option value="'+esc(c)+'"'+(f.cat===c?" selected":"")+'>'+esc(c)+'</option>';}).join("")+'</select><select class="in" id="fKl" style="flex:0 0 auto;width:92px"><option value="">Klasse</option><option value="A"'+(f.kl==="A"?" selected":"")+'>A</option><option value="B"'+(f.kl==="B"?" selected":"")+'>B</option></select>'+tourSel+monSel+'<input class="in" id="fQ" placeholder="Zoek\u2026" value="'+esc(f.q||"")+'" style="flex:1;min-width:120px"></div></div>';}

function makeSortable(listEl,arr,onReorder){
  var dragging=null;
  function down(e){var row=e.currentTarget.closest("[data-sort-idx]");if(!row)return;e.preventDefault();dragging=row;row.classList.add("dragging");document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);}

  function up(){document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);if(!dragging)return;dragging.classList.remove("dragging");var order=[].slice.call(listEl.querySelectorAll("[data-sort-idx]")).map(function(r){return +r.getAttribute("data-sort-idx");});var na=order.map(function(i){return arr[i];});dragging=null;onReorder(na);}
  listEl.querySelectorAll(".draghandle").forEach(function(h){h.style.touchAction="none";h.addEventListener("pointerdown",down);});
}

function evalPerfGoals(pid){return (state.goals||[]).filter(function(g){return g.type==="prestatie"&&g.playerId===pid&&(typeof goalActive!=="function"||goalActive(g));});}
function evalGroups(pid){var goals=evalPerfGoals(pid);var groups=[];var sc=goals.filter(goalIsScoring);if(sc.length)groups.push({key:"scoring",label:"Scoring",goals:sc});goalPerfCatsOrdered().forEach(function(c){var lg=goals.filter(function(g){return g.cat===c.key&&!goalIsScoring(g);});if(lg.length)groups.push({key:c.key,label:c.label,goals:lg});});return groups;}
function evalFmt(v,dec){return v==null?"\u2013":((v>0&&dec>0&&false)?"":"")+v.toFixed(dec);}
function evalIsLow(b,t,better){if(b!=null&&t!=null&&t!==b)return t<b;return better==="low";}

/* Vorm = (fitness \u2212 k\u00b7vermoeidheid) \u00d7 scherpte.

   - een wedstrijdweek is zelf een zware prikkel (wedstrijdfactor), dus je piekt \u00f3p de wedstrijd

function saveEdition(){
  var d=edDraft;var inc=!d.defId;
  if(inc && (!d.name||!d.name.trim())){toast("Geef het toernooi een naam");return;}
  if(!d.start){toast("Kies een startdatum");return;}
  if(!d.end)d.end=d.start;
  if(d.end<d.start){toast("Einddatum ligt v\u00f3\u00f3r de start");return;}
  ["travelPre","travelPost","prepDays"].forEach(function(k){d[k]=(d[k]===""||d[k]==null)?0:Math.max(0,parseInt(d[k],10)||0);});
  d.year=(new Date(d.start)).getFullYear();
  if(inc){d.name=d.name.trim();
    if(d._saveLib){var def={id:uid(),name:d.name,cat:d.cat||"",labels:(d.labels||[]).slice(),klasse:d.klasse||""};state.tourDefs.push(def);d.defId=def.id;d.name="";d.cat="";d.labels=[];d.klasse="";}
    delete d._saveLib;
  }
  var i=state.tourEditions.findIndex(function(e){return e.id===d.id;});
  if(i>=0)state.tourEditions[i]=d;else state.tourEditions.push(d);
  save();closeSheet();planYear=d.year;renderPlanning();toast("Toernooi opgeslagen \u2713");
}

/* ---- Library (definitions) ---- */
function openLibrary(){
  var sh=$("#sheet");var f={q:"",lab:"",cat:"",kl:"",tour:""};
  function draw(){
    var all=(state.tourDefs||[]).filter(function(d){return pickMatch(d,f);});
    if(f.tour==="__none__")all=all.filter(function(d){return !d.tourId||!tourById(d.tourId);});
    else if(f.tour)all=all.filter(function(d){return d.tourId===f.tour;});
    function itemHtml(d){var t=[];if(d.klasse)t.push("Klasse "+esc(d.klasse));if(d.cat)t.push(esc(d.cat));(d.labels||[]).forEach(function(l){t.push(esc(l));});return '<button class="bkpitem" data-def="'+d.id+'"><b>'+esc(d.name)+'</b>'+(t.length?' <small class="muted">'+t.join(" \u00b7 ")+'</small>':'')+'</button>';}
    function grp(key,name,ds){var open=libTourOpen[key]!==false;return '<div class="tourgrp"><button class="tourgh'+(open?" open":"")+'" data-tgl="'+key+'"><span class="chev">\u25b6</span><b>'+esc(name)+'</b><span class="muted" style="font-weight:600;margin-left:auto">'+ds.length+'</span></button>'+(open?'<div class="tourgb">'+ds.map(itemHtml).join("")+'</div>':'')+'</div>';}
    var groups='';
    (state.tours||[]).forEach(function(tr){var ds=all.filter(function(d){return d.tourId===tr.id;}).sort(byName);if(ds.length)groups+=grp(tr.id,tr.name,ds);});
    var loose=all.filter(function(d){return !d.tourId||!tourById(d.tourId);}).sort(byName);
    if(loose.length)groups+=grp("__none__","Zonder tour",loose);
    if(!groups)groups='<p class="muted" style="margin:0">Nog geen toernooien. Voeg er een toe of maak incidentele toernooien en bewaar ze.</p>';
    var html='<div class="shead"><div><h2>Toernooi database</h2><div class="sx">Terugkerende toernooien</div></div><button class="xbtn" onclick="closeSettings()">\u00d7</button></div>';
    html+=filterCard(f,false,true);
    html+='<div class="row" style="gap:8px;margin-bottom:12px"><button class="btn blue" style="flex:2" id="lbAdd">+ Nieuw toernooi</button><button class="btn ghost" style="flex:1" id="lbTours">Tours</button></div>';
    html+='<div class="card"><div class="scrollbox">'+groups+'</div></div>';
    sh.innerHTML=html;
    bindFilterCard(f,draw,$("#sheet"));
    $("#lbAdd").onclick=function(){openDefForm(null);};
    $("#lbTours").onclick=function(){openTours();};
    sh.querySelectorAll("[data-tgl]").forEach(function(b){b.onclick=function(){var k=b.dataset.tgl;libTourOpen[k]=(libTourOpen[k]===false)?true:false;draw();};});
    sh.querySelectorAll("[data-def]").forEach(function(b){b.onclick=function(){openDefForm(b.dataset.def);};});
  }
  draw();openSheet();
}
var defDraft=null;

function renameAcross(kind,oldV,newV){
